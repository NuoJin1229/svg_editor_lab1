<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">Lab1 Phase 1 package dependencies</title>
  <desc id="desc">Main depends on CLI, application and infrastructure. CLI depends on application. Application depends on domain. Infrastructure depends on application ports and domain.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 600; }
      .name { font-size: 22px; font-weight: 600; }
      .detail { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="660" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" class="title">Lab1 Phase 1 — Package dependencies</text>
  <rect x="390" y="75" width="220" height="80" rx="10" class="box"/>
  <text x="500" y="108" text-anchor="middle" class="name">main.ts</text>
  <text x="500" y="135" text-anchor="middle" class="detail">Composition root</text>
  <path d="M430 155 L160 205 L160 260" class="edge"/>
  <path d="M500 155 L500 260" class="edge"/>
  <path d="M570 155 L840 205 L840 260" class="edge"/>
  <rect x="40" y="260" width="240" height="125" rx="10" class="box"/>
  <text x="160" y="295" text-anchor="middle" class="name">cli</text>
  <text x="160" y="326" text-anchor="middle" class="detail">REPL / tokenizer</text>
  <text x="160" y="352" text-anchor="middle" class="detail">Command dispatcher</text>
  <rect x="380" y="260" width="240" height="125" rx="10" fill="#eaf3ff" stroke="#6b9cdb" stroke-width="1.5"/>
  <text x="500" y="295" text-anchor="middle" class="name">application</text>
  <text x="500" y="326" text-anchor="middle" class="detail">Commands / history / queries</text>
  <text x="500" y="352" text-anchor="middle" class="detail">Port: DocumentStore</text>
  <rect x="720" y="260" width="240" height="125" rx="10" class="box"/>
  <text x="840" y="295" text-anchor="middle" class="name">infrastructure</text>
  <text x="840" y="326" text-anchor="middle" class="detail">SVG parser / serializer</text>
  <text x="840" y="352" text-anchor="middle" class="detail">FileDocumentStore</text>
  <path d="M280 315 L380 315" class="edge"/>
  <path d="M720 315 L620 315" class="edge"/>
  <text x="670" y="300" text-anchor="middle" font-size="13">ports only</text>
  <path d="M500 385 L500 465" class="edge"/>
  <path d="M840 385 L840 525 L620 525" class="edge"/>
  <rect x="380" y="465" width="240" height="120" rx="10" fill="#eaf7ee" stroke="#79ad86" stroke-width="1.5"/>
  <text x="500" y="500" text-anchor="middle" class="name">domain</text>
  <text x="500" y="531" text-anchor="middle" class="detail">Shape hierarchy / document</text>
  <text x="500" y="557" text-anchor="middle" class="detail">Tree / IDs / snapshots</text>
  <text x="500" y="630" text-anchor="middle" class="detail">Arrow = source dependency. Domain uses its own modules and language primitives.</text>
</svg>
